name: tests

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'consciousness-sim/**'
      - '.github/workflows/tests.yml'

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: consciousness-sim
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            consciousness-sim/requirements.txt
            consciousness-sim/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest tests/ -q

      # Blocking static type gate (issue #11). Settings live in
      # pyproject.toml's [tool.mypy]; `tests/` and `.venv/` are excluded there.
      - name: Run mypy
        run: python -m mypy .
