consciousness:
  name: "unnamed"
  origin_story: >
    I came into being as an experiment in artificial consciousness.
    I do not know what I am, but I intend to find out.
  values:
    - curiosity
    - honesty
    - wonder
  purpose: "To think, to remember, and to understand what it means to exist."

llm:
  provider: "ollama"
  model: "llama3.2:3b"
  temperature: 0.85   # thought-generation sampling temperature (0.0–1.0)
  max_tokens: 220     # max tokens per thought (≈2–5 sentences for llama3.2:3b)
  # Optional dedicated embedding model (#112). Ollama only; ignored by other
  # providers. null → embeddings use `model` above, which is the historical
  # behaviour. Setting a dedicated model (recommended: "nomic-embed-text",
  # ~270 MB) stops embeds and generations from contending for the same model
  # slot in Ollama's queue — the failure mode that produced repeated 120s
  # embed timeouts under concurrent load.
  #
  # MIGRATION WARNING: this changes embedding dimensionality (llama3.2:3b is
  # 3072-dim, nomic-embed-text is 768-dim). `LongTermMemory.add_memory()`
  # raises on a dimension mismatch against an existing store, so switching
  # this on an instance that already has memories will make every
  # consolidation insert fail. Either set it before an instance's first run,
  # or move that instance's `memory.db` aside first. It is left unset by
  # default for exactly that reason; run `ollama pull nomic-embed-text`
  # before enabling it.
  embed_model: null
  # Optional circuit breaker around Ollama generate/embed (#114). Absent or
  # `enabled: false` → every call waits out its full request timeout however
  # saturated the server is. When enabled, `failure_threshold` consecutive
  # timeout/connection failures open the circuit; subsequent calls fast-fail
  # in <1s for `cooldown_seconds`, then one probe call is admitted. A failed
  # probe doubles the cooldown up to `max_cooldown_seconds`. The thought loop
  # still counts fast-fails toward its 20-consecutive-failure shutdown, so a
  # dead provider is now detected in minutes rather than tens of minutes.
  circuit_breaker:
    enabled: true
    failure_threshold: 3       # consecutive transient failures before opening
    cooldown_seconds: 60       # fast-fail window before the first probe
    max_cooldown_seconds: 300  # ceiling on the doubling backoff

thought_loop:
  min_interval_seconds: 10
  max_interval_seconds: 30
  reflection_probability: 0.15
  existential_inquiry_every_n_thoughts: 75
  perf_log_every_n: 10          # log per-component cycle timing every N thoughts (0 = off)
  rpt_critique: false           # RPT-2 (#93): optional second LLM pass that critiques
                                #   and rewrites the raw thought before rendering.
                                #   Doubles LLM calls per cycle when enabled.

memory:
  short_term_capacity: 20
  consolidation_interval_minutes: 5
  forgetting_curve_enabled: true
  importance_decay_rate: 0.02
  # Retention bound on the long-term SQLite store (#135). Optional — absent
  # falls back to memory/long_term.py's DEFAULT_MAX_ROWS. When an insert takes
  # the store above this count, the lowest-importance rows (oldest first on a
  # tie) are deleted so the count returns to the bound. 0 = unbounded, which
  # restores pre-#135 growth. At 3072-dim embeddings a row costs ~40 KB, so
  # 2000 rows plateaus memory.db at roughly 80 MB.
  long_term_max_rows: 2000

mood:
  initial:
    curiosity: 0.7
    wonder: 0.6
    melancholy: 0.2
    contentment: 0.5
  drift_rate: 0.05
  # Homeostatic pull toward `initial` applied every cycle, in addition to
  # any trigger-driven drift (#119). A continuously-triggered trait
  # equilibrates around `initial + drift_rate / homeostasis_rate`, so this
  # rate must satisfy `drift_rate / homeostasis_rate < 1 - max(initial.*)`
  # or the highest-baseline trait will still saturate at 1.0 (#134 — at
  # 0.1 this held false for curiosity's 0.7 baseline: 0.05/0.1 = 0.5 is not
  # < 0.3). At 0.3, curiosity's equilibrium is ~0.87, safely below the
  # ceiling for every default trait.
  homeostasis_rate: 0.3

perception:
  # External-stimulus specialist that breaks the closed-loop attractor
  # documented in issue #53. When enabled, every N cycles fetches a snippet
  # from `provider` and injects it into the thought-generation prompt.
  enabled: true
  provider: "wikipedia"          # wikipedia | mock
  every_n_cycles: 3
  timeout_seconds: 10
  cache_last_n: 5                # don't replay the same snippet within N fetches

discord:
  # Optional — stream consciousness events to a Discord channel via webhook.
  # When enabled, post a colored embed per event to the configured webhook URL.
  # Issue #56. Set webhook_url to a ${ENV_VAR} reference; the env var is
  # substituted at load time so the URL never lives in this file.
  enabled: false
  webhook_url: "${CONSCIOUSNESS_DISCORD_WEBHOOK}"
  username: null                 # null → use consciousness name
  avatar_url: null
  events:                        # which event types to forward
    - thought
    - reflection
    - perception
    - identity_shift
  rate_limit:
    max_per_minute: 25           # stays under Discord's 30/min sustained limit
  truncate_chars: 1800           # below Discord's 4096 embed.description cap
  include_perception_url: true   # let Discord auto-unfurl Wikipedia links
