# RPT-2 (#93) empirical A/B — critique-and-refine pass disabled (control).
#
# Pairs with rpt-critique-on.yaml. Both manifests are identical except for
# thought_loop.rpt_critique, so any difference in the resulting metrics is
# attributable to the critique pass rather than to some other config drift.
# Real-Ollama, wall-clock-bound like ollama-20min-atlas.yaml so the two runs
# are comparable in scale.

name: rpt-critique-off
description: >
  Control run for the RPT-2 critique-and-refine A/B (#93) — default config
  with thought_loop.rpt_critique explicitly false (the default; set here for
  clarity and symmetry with rpt-critique-on.yaml).

consciousness_name: RptCritiqueOff

config_overrides:
  thought_loop:
    rpt_critique: false

duration:
  minutes: 20

success_criteria:
  - kind: mood.dimensions_non_degenerate
    op: ">="
    value: 2
  - kind: event_counts.thought
    op: ">="
    value: 5

tags:
  - real-ollama
  - rpt-critique-ab
  - rpt-critique-off
  - llama3.2-3b
