consciousness:
  name: unnamed
  origin_story: 'I came into being as an experiment in artificial consciousness. I
    do not know what I am, but I intend to find out.

    '
  values:
  - curiosity
  - honesty
  - wonder
  purpose: To think, to remember, and to understand what it means to exist.
llm:
  provider: mock
  model: mock
  temperature: 0.85
  max_tokens: 220
thought_loop:
  min_interval_seconds: 0
  max_interval_seconds: 0
  reflection_probability: 0.15
  existential_inquiry_every_n_thoughts: 75
  perf_log_every_n: 10
memory:
  short_term_capacity: 20
  consolidation_interval_minutes: 1000
  forgetting_curve_enabled: true
  importance_decay_rate: 0.02
mood:
  initial:
    curiosity: 0.7
    wonder: 0.6
    melancholy: 0.2
    contentment: 0.5
  drift_rate: 0.05
perception:
  enabled: true
  provider: mock
  every_n_cycles: 2
  timeout_seconds: 10
  cache_last_n: 5
discord:
  enabled: false
  webhook_url: ${CONSCIOUSNESS_DISCORD_WEBHOOK}
  username: null
  avatar_url: null
  events:
  - thought
  - reflection
  - perception
  - identity_shift
  rate_limit:
    max_per_minute: 25
  truncate_chars: 1800
  include_perception_url: true
