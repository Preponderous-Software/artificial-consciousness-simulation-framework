<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consciousness Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0e0f13;
      --surface:     #161820;
      --border:      #2a2d3a;
      --text:        #c8cad4;
      --muted:       #8b8fa8;   /* raised from #5a5d6e — WCAG AA on --bg */
      --accent:      #7c83ff;
      --reflect:     #b48eff;
      --perceive:    #fbbf24;   /* external stimulus — warm amber */
      --online:      #4ade80;
      --offline:     #f87171;
      --thought-bg:  #1a1d26;
      --pill-bg:     #1e2130;
      --history-opacity: 0.6;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Georgia', serif; font-size: 15px; line-height: 1.6; }

    /* ── layout ── */
    .shell { display: flex; flex-direction: column; height: 100vh; }

    header {
      display: flex; align-items: stretch; gap: 0;
      padding: 0; border-bottom: 1px solid var(--border);
      background: var(--surface); flex-shrink: 0; overflow: hidden;
      min-height: 42px;
    }

    /* Brand — left-anchored identity, doubles as a link to the repo */
    #brand {
      font-family: monospace; font-size: 12px; color: var(--muted);
      padding: 0 14px; text-decoration: none;
      border-right: 1px solid var(--border);
      display: flex; align-items: center; gap: 4px;
      letter-spacing: .05em; flex-shrink: 0;
      transition: color .15s;
    }
    #brand:hover, #brand:focus-visible { color: var(--text); outline: none; }
    #brand span { color: var(--accent); }

    /* "+ New" — a button, not a tab — sits between the strip and header-right */
    #new-btn {
      background: transparent; border: none;
      border-left: 1px solid var(--border);
      padding: 0 16px; color: var(--accent);
      font-family: monospace; font-size: 13px; font-weight: bold;
      cursor: pointer; flex-shrink: 0;
      transition: background .15s, color .15s;
    }
    #new-btn:hover { background: var(--thought-bg); color: var(--text); }
    #new-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

    /* Scrollable tab strip — no wrapping */
    #tab-strip-wrap { position: relative; flex: 1; min-width: 0; display: flex; }
    /* Fade gradients on edges indicate scrollable overflow without a scrollbar */
    #tab-strip-wrap::before, #tab-strip-wrap::after {
      content: ''; position: absolute; top: 0; bottom: 0; width: 24px;
      pointer-events: none; z-index: 2; opacity: 0; transition: opacity .15s;
    }
    #tab-strip-wrap::before { left: 0;  background: linear-gradient(to right, var(--surface), transparent); }
    #tab-strip-wrap::after  { right: 0; background: linear-gradient(to left,  var(--surface), transparent); }
    #tab-strip-wrap.overflow-left::before  { opacity: 1; }
    #tab-strip-wrap.overflow-right::after  { opacity: 1; }
    #instance-tabs {
      display: flex; gap: 0; flex: 1; min-width: 0;
      overflow-x: auto; scrollbar-width: none;
    }
    #instance-tabs::-webkit-scrollbar { display: none; }

    .tab {
      display: flex; align-items: center; gap: 7px;
      padding: 12px 18px; border: none; border-right: 1px solid var(--border);
      cursor: pointer; font-size: 13px; font-family: monospace;
      background: transparent; color: var(--muted); white-space: nowrap;
      transition: background .15s, color .15s; flex-shrink: 0;
    }
    .tab:hover { background: var(--thought-bg); color: var(--text); }
    .tab.active { background: var(--bg); color: var(--text); border-bottom: 2px solid var(--accent); }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--offline); flex-shrink: 0; }
    .tab.online .dot { background: var(--online); }

    /* Modal */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); z-index: 50;
      display: flex; align-items: center; justify-content: center;
    }
    .modal {
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      padding: 22px 24px; min-width: 340px; max-width: 90vw;
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.6);
    }
    .modal h3 { font-size: 14px; margin-bottom: 14px; font-family: monospace; }
    .modal label {
      display: block; font-size: 11px; font-family: monospace;
      color: var(--muted); margin-bottom: 4px; margin-top: 12px;
      text-transform: uppercase; letter-spacing: .08em;
    }
    .modal input, .modal select {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      color: var(--text); padding: 8px 10px; border-radius: 4px;
      font-family: monospace; font-size: 13px;
    }
    .modal input:focus, .modal select:focus {
      border-color: var(--accent); outline: none;
    }
    .modal-actions {
      display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px;
    }
    .modal-actions button {
      background: var(--bg); border: 1px solid var(--border); color: var(--text);
      padding: 7px 14px; border-radius: 4px; cursor: pointer;
      font-family: monospace; font-size: 12px;
    }
    .modal-actions button.primary {
      background: var(--accent); border-color: var(--accent); color: #fff;
    }
    .modal-actions button.danger {
      background: var(--offline); border-color: var(--offline); color: #fff;
    }
    .modal-actions button:hover { border-color: var(--accent); }
    .modal-actions button.danger:hover { border-color: var(--offline); filter: brightness(1.1); }
    .modal-actions button:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 2px;
    }
    .modal-error {
      color: var(--offline); font-size: 12px; font-family: monospace;
      margin-top: 10px; min-height: 14px; white-space: pre-wrap;
    }
    .confirm-message {
      font-size: 13px; color: var(--text); line-height: 1.55; margin: 4px 0 6px;
    }

    /* Lifecycle buttons in the status panel */
    #stop-btn, #start-btn {
      background: transparent; padding: 6px 12px; border-radius: 4px;
      cursor: pointer; font-family: monospace; font-size: 12px;
      margin-top: 12px; display: none;
    }
    #stop-btn  { border: 1px solid var(--offline); color: var(--offline); }
    #start-btn { border: 1px solid var(--online);  color: var(--online); }
    #stop-btn:hover  { background: var(--offline); color: #fff; }
    #start-btn:hover { background: var(--online);  color: #fff; }
    #stop-btn:disabled, #start-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    #stop-btn:focus-visible, #start-btn:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 2px;
    }

    /* SSE dropped-event indicator (issue #94) — a slow browser tab can miss
       events with no other visible sign; this surfaces the divergence. */
    .sse-drop-warning {
      display: inline-block; margin-top: 12px; margin-left: 8px;
      color: var(--perceive); font-size: 13px; cursor: help;
    }

    #header-right {
      display: flex; align-items: center; gap: 12px;
      padding: 0 16px; flex-shrink: 0; border-left: 1px solid var(--border);
      height: 100%; min-width: 120px;
    }
    #current-name { font-size: 13px; font-family: monospace; color: var(--text); font-weight: bold; }
    #status-indicator { font-size: 12px; font-family: monospace; color: var(--muted); }
    #status-indicator.connected { color: var(--online); }
    #status-indicator.error     { color: var(--offline); }
    /* Subtle breathing animation when live — ambient "I'm alive" signal
       between thought cycles (which can be up to 30s apart). */
    #status-indicator.connected { animation: breath 2.4s ease-in-out infinite; }
    @keyframes breath {
      0%, 100% { opacity: 1; }
      50%      { opacity: .55; }
    }

    main { display: flex; flex: 1; overflow: hidden; }

    /* ── stream panel ── */
    #stream-panel { flex: 3; display: flex; flex-direction: column; border-right: 1px solid var(--border); overflow: hidden; }
    #stream-header {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 10px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    #stream-header h2 { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-family: monospace; }
    #filter-chips { display: flex; gap: 6px; }
    .chip {
      background: transparent; border: 1px solid var(--border); color: var(--muted);
      font-family: monospace; font-size: 11px; padding: 3px 10px; border-radius: 20px;
      cursor: pointer; transition: background .15s, color .15s, border-color .15s;
    }
    .chip:hover { color: var(--text); border-color: var(--accent); }
    .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* Legend trigger — labeled rather than a bare "?" so its purpose is obvious */
    .legend {
      display: inline-flex; align-items: center; gap: 5px;
      margin-left: 8px; padding: 2px 9px;
      border: 1px solid var(--border); border-radius: 12px;
      color: var(--muted); font-size: 11px; font-family: monospace;
      cursor: help; flex-shrink: 0; user-select: none;
      background: transparent;
    }
    .legend:hover, .legend:focus-visible { color: var(--text); border-color: var(--accent); outline: none; }
    /* Detached popover positioned below the trigger */
    .legend-pop {
      position: absolute; z-index: 10; background: var(--surface);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 12px 14px; font-size: 12px; color: var(--text);
      box-shadow: 0 4px 16px rgba(0,0,0,.5);
      display: none; max-width: 320px; line-height: 1.5;
    }
    .legend-pop.open { display: block; }
    .legend-pop .row {
      display: grid; grid-template-columns: 6px 1fr; gap: 10px; padding: 4px 0;
      align-items: start;
    }
    .legend-pop .swatch { width: 4px; height: 100%; min-height: 14px; border-radius: 2px; }
    .legend-pop b { color: var(--text); font-weight: 600; }
    .legend-pop .desc { color: var(--muted); font-size: 11px; }
    .legend-pop .footnote { margin-top: 8px; color: var(--muted); font-size: 11px; font-style: italic; }
    .legend-pop .shortcut { color: var(--muted); font-size: 11px; margin-top: 8px; }
    .legend-pop .shortcut kbd {
      background: var(--bg); border: 1px solid var(--border); border-radius: 3px;
      padding: 1px 5px; font-family: monospace; font-size: 10px;
    }

    /* Toast for soft notifications (e.g. deep-link not found) */
    #toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
      padding: 10px 16px; font-size: 13px; color: var(--text);
      box-shadow: 0 4px 16px rgba(0,0,0,.5);
      opacity: 0; pointer-events: none; transition: opacity .25s;
      z-index: 100; max-width: 90vw;
    }
    #toast.show { opacity: 1; }
    #thought-stream { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    /* Multi-select type filters: when stream has .hide-foo, hide .foo bubbles.
       The "all" chip clears every hide-* class; individual chips toggle one. */
    #thought-stream.hide-thought        .bubble.thought        { display: none; }
    #thought-stream.hide-reflection     .bubble.reflection     { display: none; }
    #thought-stream.hide-identity_shift .bubble.identity_shift { display: none; }
    #thought-stream.hide-perception     .bubble.perception     { display: none; }

    /* History separator */
    .history-sep {
      display: flex; align-items: center; gap: 10px;
      font-size: 11px; font-family: monospace; color: var(--muted); padding: 4px 0;
    }
    .history-sep::before, .history-sep::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* Waiting state — shown while live stream has no events yet */
    .stream-waiting {
      display: flex; align-items: center; gap: 10px;
      color: var(--muted); font-size: 13px; font-style: italic; padding: 12px 4px;
    }
    .stream-waiting .pulse {
      width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: .3; transform: scale(.8); }
      50%      { opacity: 1;  transform: scale(1.1); }
    }

    /* Make status indicator obviously clickable when in an error state */
    #status-indicator.error { cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
    #status-indicator.error:hover { color: var(--text); }

    /* Thought bubbles */
    .bubble {
      background: var(--thought-bg); border-radius: 6px; padding: 11px 14px;
      border-left: 3px solid var(--border); font-size: 14px;
      animation: fadein .35s ease; cursor: pointer;
      transition: border-color .15s, box-shadow .15s;
    }
    .bubble:hover, .bubble:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 1px var(--border); outline: none; }
    .bubble:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
    .bubble.reflection { border-left-color: var(--reflect); font-style: italic; }
    .bubble.identity_shift { border-left-color: var(--online); }
    .bubble.perception { border-left-color: var(--perceive); background: rgba(251, 191, 36, 0.04); }
    .bubble.perception .meta .ts::before { content: "⊕ "; color: var(--perceive); }
    .bubble.history { opacity: var(--history-opacity); }

    .bubble .meta {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 11px; color: var(--muted); font-family: monospace; margin-bottom: 6px;
    }
    .bubble .meta .left { display: flex; gap: 6px; }
    .bubble .chevron { font-size: 10px; transition: opacity .15s; opacity: .5; user-select: none; }
    .bubble:hover .chevron { opacity: 1; }

    .bubble .body { white-space: pre-wrap; word-break: break-word; }
    .bubble .body.collapsed {
      display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
    }
    /* Short bubbles (no clamp overflow) — don't lie that there's more to see */
    .bubble.no-overflow { cursor: default; }
    .bubble.no-overflow:hover { border-color: var(--border); box-shadow: none; }
    .bubble.no-overflow .chevron { display: none; }

    /* Scroll-anchor hint */
    #scroll-hint {
      position: sticky; bottom: 8px; align-self: center;
      background: var(--accent); color: #fff; font-size: 11px; font-family: monospace;
      padding: 4px 12px; border: none; border-radius: 20px; cursor: pointer; display: none;
      box-shadow: 0 2px 8px rgba(0,0,0,.4);
    }
    #scroll-hint:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

    @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    /* ── sidebar ── */
    #sidebar { flex: 1; min-width: 240px; max-width: 310px; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 20px; }

    .sidebar-section h3 { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-family: monospace; margin-bottom: 10px; }

    #identity-name {
      font-size: 22px; font-weight: 500; margin-bottom: 4px; color: var(--text);
      letter-spacing: .02em;
    }
    #self-concept { font-size: 13px; color: var(--muted); font-style: italic; }

    #values-list { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .value-pill { background: var(--pill-bg); border: 1px solid var(--border); border-radius: 20px; padding: 2px 10px; font-size: 12px; font-family: monospace; color: var(--muted); }

    #mood-chart { display: flex; flex-direction: column; gap: 7px; }
    .mood-row { display: flex; align-items: center; gap: 8px; }
    .mood-label { width: 84px; font-size: 12px; font-family: monospace; color: var(--muted); flex-shrink: 0; }
    .mood-track { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .mood-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width .6s ease; }
    .mood-value { width: 36px; text-align: right; font-size: 11px; font-family: monospace; color: var(--muted); flex-shrink: 0; }

    #status-grid { display: grid; grid-template-columns: auto 1fr; gap: 5px 10px; font-size: 13px; }
    .stat-label { color: var(--muted); font-family: monospace; font-size: 12px; }
    .stat-value { font-family: monospace; }

    #no-instance {
      display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px;
      flex: 1; color: var(--muted); font-size: 14px; text-align: center; padding: 24px;
    }
    #no-instance .hint { font-style: italic; }
    #no-instance code {
      background: var(--surface); border: 1px solid var(--border); border-radius: 4px;
      padding: 6px 10px; font-family: monospace; font-size: 13px; color: var(--text);
      user-select: all;
    }
    /* Inline keyboard hints */
    kbd {
      background: var(--surface); border: 1px solid var(--border); border-radius: 3px;
      padding: 1px 6px; font-family: monospace; font-size: 11px;
      color: var(--text); display: inline-block; min-width: 18px; text-align: center;
    }

    @media (max-width: 700px) {
      main { flex-direction: column; }
      #stream-panel { flex: 1 1 auto; min-height: 0; border-right: none; }
      /* Cap stacked sidebar so it doesn't dominate the viewport; scroll instead. */
      #sidebar { max-width: none; max-height: 40vh; border-top: 1px solid var(--border); }
      /* Larger touch targets on phones */
      .tab { padding: 14px 18px; }
      /* Free up header width on narrow screens — brand label hides; the
         "+ New" button stays since it's the primary entry point. */
      #brand { display: none; }
      #header-right { min-width: 100px; padding: 0 10px; gap: 8px; }
      #current-name { font-size: 12px; }
      #status-indicator { font-size: 11px; }
    }
  </style>
</head>
<body>
<div class="shell">
  <header>
    <a id="brand" href="https://github.com/dmccoystephenson/artificial-consciousness-simulation-framework"
       target="_blank" rel="noopener" title="View project on GitHub">
      <span aria-hidden="true">◦</span> consciousness
    </a>
    <div id="tab-strip-wrap">
      <div id="instance-tabs"></div>
    </div>
    <button id="new-btn" type="button"
            title="Spawn a new consciousness (press N)"
            aria-label="Spawn a new consciousness">+ New</button>
    <div id="header-right">
      <span id="current-name"></span>
      <span id="status-indicator" title="Stream connection status">—</span>
    </div>
  </header>
  <main id="main-area">
    <div id="no-instance">Select an instance above to begin observing.</div>
  </main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="confirm-host"></div>

<script>
"use strict";

const $ = id => document.getElementById(id);

let currentId    = null;        // stable directory name — used for /stream/{id} and #/id
let currentName  = null;        // display label (identity.name)
let currentOnline = false;      // process running (any source)
let currentStreamable = false;  // this dashboard process can deliver live events
let instanceStartedAt = null;   // ISO string from API (instance process start)
let sse          = null;
let uptimeTimer  = null;
let thoughtCount = 0;
let ltMemories   = 0;
let lastReflection = "—";
let historyEventCount = 0;      // events received before history_end (per SSE connection)
let liveEventCount    = 0;      // events received after history_end (per SSE connection)

// ── instance tabs ─────────────────────────────────────────────────────────

async function loadInstances() {
  try {
    const res = await fetch("/instances");
    const instances = await res.json();
    // Normalize: older payloads may lack `id`; fall back to `name`
    instances.forEach(i => { if (!i.id) i.id = i.name; });
    renderTabs(instances);

    if (instances.length === 0) {
      currentId = null; currentName = null;
      showEmptyState();
      return;
    }

    if (!currentId) {
      const hashed = decodeURIComponent((location.hash || "").replace(/^#\/?/, ""));
      const matched = hashed && instances.find(i => i.id === hashed);
      const target = matched
                  || instances.find(i => i.streamable)
                  || instances.find(i => i.running)
                  || instances[0];
      if (hashed && !matched) {
        toast(`No instance “${hashed}” — showing “${target.name}” instead`);
      }
      selectInstance(target.id, instances);
    } else {
      const cur = instances.find(i => i.id === currentId);
      if (!cur) {
        const fallback = instances.find(i => i.streamable) || instances.find(i => i.running) || instances[0];
        selectInstance(fallback.id, instances);
      } else if (cur.streamable !== currentStreamable || cur.running !== currentOnline) {
        currentOnline = cur.running;
        currentStreamable = cur.streamable;
        // Refresh sidebar buttons (Start vs Stop) and reconnect SSE.
        renderStatus(cur);
        connectSSE(currentId);
      } else {
        // No running-state change, but the drop count can still have moved —
        // keep the ⚠ indicator current on every poll.
        updateSseHealthIndicator(cur);
      }
    }
  } catch (e) {
    console.error("Failed to load instances", e);
  }
}

function showEmptyState() {
  $("main-area").innerHTML = `
    <div id="no-instance">
      <div>No consciousness instances yet.</div>
      <div class="hint">Click <strong>+ New</strong> in the header (or press <kbd>N</kbd>) to spawn one, or from the CLI:</div>
      <code>python scripts/spawn.py --name Aria --bg</code>
    </div>`;
  $("current-name").textContent = "";
  $("status-indicator").textContent = "—";
  $("status-indicator").className = "";
  if (sse) { sse.close(); sse = null; }
}

function updateTabOverflow() {
  const wrap = $("tab-strip-wrap");
  const tabs = $("instance-tabs");
  if (!wrap || !tabs) return;
  const left  = tabs.scrollLeft > 2;
  const right = tabs.scrollLeft + tabs.clientWidth < tabs.scrollWidth - 2;
  wrap.classList.toggle("overflow-left",  left);
  wrap.classList.toggle("overflow-right", right);
}

function renderTabs(instances) {
  const container = $("instance-tabs");
  container.innerHTML = "";
  container.setAttribute("role", "tablist");
  // Wire scroll observation once
  if (!container._overflowWired) {
    container.addEventListener("scroll", updateTabOverflow, { passive: true });
    window.addEventListener("resize", updateTabOverflow);
    container._overflowWired = true;
  }
  for (const inst of instances) {
    const tab = document.createElement("button");
    const isActive = inst.id === currentId;
    tab.className = "tab" + (inst.running ? " online" : "") + (isActive ? " active" : "");
    tab.title = inst.running ? "Running — live stream" : "Stopped — showing last known state";
    tab.setAttribute("role", "tab");
    tab.setAttribute("aria-selected", String(isActive));
    tab.setAttribute("aria-label", `${inst.name}, ${inst.running ? "running" : "stopped"}`);
    tab.innerHTML = `<span class="dot" aria-hidden="true"></span>${esc(inst.name)}`;
    tab.onclick = () => selectInstance(inst.id, instances);
    container.appendChild(tab);
  }
  // After layout: recompute overflow shadows and scroll active tab into view
  requestAnimationFrame(() => {
    updateTabOverflow();
    const active = container.querySelector(".tab.active");
    if (active) active.scrollIntoView({ block: "nearest", inline: "nearest" });
  });
}

function selectInstance(id, instances) {
  // Short-circuit when the user re-clicks the active tab — avoids
  // a wasteful SSE teardown + "connecting…" flash.
  if (id === currentId) {
    // Still refresh tab decorations in case streamable/running changed
    renderTabs(instances);
    return;
  }
  const inst = instances.find(i => i.id === id) || {};
  currentId          = id;
  currentName        = inst.name ?? id;
  currentOnline      = inst.running ?? false;
  currentStreamable  = inst.streamable ?? false;
  instanceStartedAt  = inst.started_at ?? null;
  thoughtCount       = inst.thought_count ?? 0;
  ltMemories         = 0;
  lastReflection     = "—";

  // URL hash uses the stable id, not the display name
  const wanted = "#/" + encodeURIComponent(id);
  if (location.hash !== wanted) history.replaceState(null, "", wanted);

  $("current-name").textContent = currentName;
  renderTabs(instances);
  buildLayout();
  updateSidebar(inst);
  connectSSE(id);
}

// ── layout ────────────────────────────────────────────────────────────────

function buildLayout() {
  $("main-area").innerHTML = `
    <div id="stream-panel">
      <div id="stream-header">
        <h2>Stream of Thought</h2>
        <div id="filter-chips" role="group" aria-label="Filter by event type">
          <button class="chip active" data-filter="all"            aria-pressed="true">all</button>
          <button class="chip"        data-filter="thought"        aria-pressed="true">thoughts</button>
          <button class="chip"        data-filter="reflection"     aria-pressed="true">reflections</button>
          <button class="chip"        data-filter="perception"     aria-pressed="true">perceptions</button>
          <button class="chip"        data-filter="identity_shift" aria-pressed="true">identity</button>
          <button type="button" class="legend" id="legend-trigger"
                  aria-label="Event type legend" aria-haspopup="true" aria-expanded="false">
            <span aria-hidden="true">?</span> legend
          </button>
        </div>
      </div>
      <div id="thought-stream"></div>
      <button type="button" id="scroll-hint" onclick="scrollToBottom()" aria-label="Scroll to newest thoughts">↓ new thoughts</button>
    </div>
    <aside id="sidebar">
      <div class="sidebar-section">
        <h3>Identity</h3>
        <div id="identity-name">—</div>
        <div id="self-concept"></div>
        <div id="values-list"></div>
      </div>
      <div class="sidebar-section">
        <h3>Mood</h3>
        <div id="mood-chart"></div>
      </div>
      <div class="sidebar-section">
        <h3>Status</h3>
        <div id="status-grid"></div>
      </div>
    </aside>`;

  // Show "↓ new thoughts" pill when user scrolls up
  const stream = $("thought-stream");
  stream.addEventListener("scroll", () => {
    $("scroll-hint").style.display = isNearBottom(stream) ? "none" : "block";
  });

  attachLegend();

  // Multi-select filter chips. "all" turns every type on; the others toggle
  // independently. State is reflected via .hide-{type} classes on the stream
  // (see CSS) so bubbles already in the DOM are filtered without rebuild.
  const chips = Array.from(document.querySelectorAll("#filter-chips .chip"));
  const typeChips = chips.filter(c => c.dataset.filter !== "all");
  const allChip   = chips.find(c => c.dataset.filter === "all");

  function syncStream() {
    typeChips.forEach(c => {
      const on = c.getAttribute("aria-pressed") === "true";
      stream.classList.toggle(`hide-${c.dataset.filter}`, !on);
      // Keep .active visual state in lockstep with aria-pressed so the
      // initial render (all chips pressed=true) shows them all active and
      // the first click on any chip produces an immediate visual change.
      c.classList.toggle("active", on);
    });
    const allOn = typeChips.every(c => c.getAttribute("aria-pressed") === "true");
    allChip.classList.toggle("active", allOn);
    allChip.setAttribute("aria-pressed", String(allOn));
  }

  allChip.onclick = () => {
    typeChips.forEach(c => {
      c.classList.add("active");
      c.setAttribute("aria-pressed", "true");
    });
    syncStream();
    scrollToBottom();
  };
  typeChips.forEach(chip => {
    chip.onclick = () => {
      const next = chip.getAttribute("aria-pressed") !== "true";
      chip.setAttribute("aria-pressed", String(next));
      chip.classList.toggle("active", next);
      syncStream();
      if (isNearBottom(stream)) scrollToBottom();
    };
  });
  syncStream();

  if (uptimeTimer) clearInterval(uptimeTimer);
  uptimeTimer = setInterval(tickUptime, 1000);
  renderStatus();
}

function scrollToBottom() {
  const stream = $("thought-stream");
  if (stream) {
    stream.scrollTop = stream.scrollHeight;
    $("scroll-hint").style.display = "none";
  }
}

function isNearBottom(el) {
  return el.scrollHeight - el.scrollTop - el.clientHeight < 80;
}

// ── sidebar rendering ─────────────────────────────────────────────────────

function updateSidebar(data) {
  const name = $("identity-name");
  if (!name) return;
  name.textContent = data.name || "—";
  $("self-concept").textContent = data.self_concept || "";
  $("values-list").innerHTML = (data.values || []).map(
    v => `<span class="value-pill">${esc(v)}</span>`
  ).join("");
  renderMood(data.mood || {});
  renderStatus(data);
}

function renderMood(mood) {
  const chart = $("mood-chart");
  if (!chart) return;
  chart.innerHTML = Object.entries(mood).map(([k, v]) => {
    const pct = Math.round((Number(v) || 0) * 100);
    return `
      <div class="mood-row">
        <span class="mood-label">${esc(k)}</span>
        <div class="mood-track"><div class="mood-fill" style="width:${pct}%"></div></div>
        <span class="mood-value">${pct}%</span>
      </div>`;
  }).join("");
}

function renderStatus(data) {
  const grid = $("status-grid");
  if (!grid) return;
  if (data && data.thought_count !== undefined) thoughtCount = data.thought_count;
  // Only show the "uptime" row when the instance is running — otherwise it's
  // just dead pixels ("—") for an indefinite value.
  const uptimeRow = currentOnline
    ? `<span class="stat-label">uptime</span><span class="stat-value" id="stat-uptime">—</span>`
    : "";
  grid.innerHTML = `
    <span class="stat-label">thoughts</span>      <span class="stat-value" id="stat-thoughts">${thoughtCount}</span>
    <span class="stat-label">memories</span>       <span class="stat-value" id="stat-lt">${ltMemories}</span>
    <span class="stat-label">last reflection</span><span class="stat-value" id="stat-refl">${lastReflection}</span>
    ${uptimeRow}`;
  const sidebarStatus = grid.parentElement;
  let stopBtn = $("stop-btn");
  if (!stopBtn) {
    stopBtn = document.createElement("button");
    stopBtn.id = "stop-btn";
    stopBtn.textContent = "Stop";
    stopBtn.title = "Send SIGTERM (graceful shutdown, 5s grace)";
    stopBtn.onclick = stopCurrentInstance;
    sidebarStatus.appendChild(stopBtn);
  }
  let startBtn = $("start-btn");
  if (!startBtn) {
    startBtn = document.createElement("button");
    startBtn.id = "start-btn";
    startBtn.textContent = "Start";
    startBtn.title = "Resume with the default provider/model from config. " +
                     "Use “+ New” with this name to customize.";
    startBtn.onclick = startCurrentInstance;
    sidebarStatus.appendChild(startBtn);
  }
  stopBtn.style.display  = currentOnline ? "inline-block" : "none";
  startBtn.style.display = currentOnline ? "none" : "inline-block";
  updateSseHealthIndicator(data);
  tickUptime();
}

// Shows/hides a ⚠ indicator in the status panel when this instance has
// dropped SSE events (slow browser tab) — see /instances' sse_drops_total.
function updateSseHealthIndicator(data) {
  const grid = $("status-grid");
  const sidebarStatus = grid && grid.parentElement;
  if (!sidebarStatus) return;
  const drops = Number(data && data.sse_drops_total) || 0;
  let warn = $("sse-drop-warning");
  if (drops <= 0) {
    if (warn) warn.remove();
    return;
  }
  if (!warn) {
    warn = document.createElement("span");
    warn.id = "sse-drop-warning";
    warn.className = "sse-drop-warning";
    warn.setAttribute("aria-hidden", "false");
    warn.textContent = "⚠";
    sidebarStatus.appendChild(warn);
  }
  warn.title = `${drops} SSE event${drops === 1 ? "" : "s"} dropped — your browser may have missed events`;
}

function tickUptime() {
  const el = $("stat-uptime");
  if (!el) return;  // row hidden when offline — nothing to update
  if (!instanceStartedAt) { el.textContent = "—"; return; }
  const s = Math.max(0, Math.floor((Date.now() - new Date(instanceStartedAt).getTime()) / 1000));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  el.textContent = h ? `${h}h ${m}m` : m ? `${m}m ${sec}s` : `${sec}s`;
}

// ── SSE ───────────────────────────────────────────────────────────────────

function connectSSE(id) {
  if (sse) { sse.close(); sse = null; }
  historyEventCount = 0;
  liveEventCount    = 0;
  const indicator = $("status-indicator");
  indicator.textContent = "connecting…";
  indicator.className = "";
  indicator.title = "";
  indicator.onclick = null;

  sse = new EventSource(`/stream/${encodeURIComponent(id)}`);

  sse.onopen = () => {
    indicator.textContent = "loading…";
    indicator.className = "";
  };

  sse.onerror = () => {
    indicator.textContent = "○ offline · click to retry";
    indicator.className = "error";
    indicator.title = "Connection lost — click to reconnect";
    indicator.onclick = () => connectSSE(currentId);
  };

  sse.onmessage = e => {
    try { handleEvent(JSON.parse(e.data)); } catch (_) {}
  };
}

// ── event handling ────────────────────────────────────────────────────────

function handleEvent(payload) {
  const type    = payload.type || "thought";
  const history = !!payload._history;

  if (type === "history_end") {
    if (historyEventCount > 0) insertSeparator(payload.live);
    if (payload.live && historyEventCount === 0) insertWaitingState();
    const indicator = $("status-indicator");
    if (payload.live) {
      indicator.textContent = "● live";
      indicator.className = "connected";
      indicator.title = "Live event stream";
      indicator.onclick = null;
    } else {
      indicator.textContent = "○ stopped";
      indicator.className = "error";
      indicator.title = "Process not running — showing the last 50 events from the journal";
      indicator.onclick = null;
    }
    return;
  }

  if (type === "thought" || type === "reflection" || type === "identity_shift" || type === "perception") {
    if (history) historyEventCount++; else liveEventCount++;
    if (!history) removeWaitingState();
    appendBubble(payload, history);
  }

  if (type === "thought" && !history) {
    thoughtCount++;
    const el = $("stat-thoughts");
    if (el) el.textContent = thoughtCount;
  }

  // Track the most recent reflection from either history or live events so
  // the sidebar shows a real timestamp instead of "—" for offline instances.
  if (type === "reflection") {
    const ts = payload.timestamp ? new Date(payload.timestamp) : new Date();
    lastReflection = relTime(ts);
    const el = $("stat-refl");
    if (el) { el.textContent = lastReflection; el.dataset.ts = ts.toISOString(); }
  }

  if (type === "memory") {
    ltMemories = payload.long_term_count ?? ltMemories;
    const el = $("stat-lt");
    if (el) el.textContent = ltMemories;
  }
}

function insertSeparator(isLive) {
  const stream = $("thought-stream");
  if (!stream) return;
  const sep = document.createElement("div");
  sep.className = "history-sep";
  sep.innerHTML = `<span>${isLive ? "↑ history · live ↓" : "last known state"}</span>`;
  const wasNearBottom = isNearBottom(stream);
  stream.appendChild(sep);
  if (wasNearBottom) stream.scrollTop = stream.scrollHeight;
}

function insertWaitingState() {
  const stream = $("thought-stream");
  if (!stream || stream.querySelector(".stream-waiting")) return;
  const w = document.createElement("div");
  w.className = "stream-waiting";
  w.innerHTML = `
    <span class="pulse" aria-hidden="true"></span>
    <span>Waiting for first thought<span style="opacity:.7"> · cycles run every 10–30s</span></span>`;
  stream.appendChild(w);
}

function removeWaitingState() {
  const stream = $("thought-stream");
  if (!stream) return;
  const w = stream.querySelector(".stream-waiting");
  if (w) w.remove();
}

function appendBubble(payload, isHistory) {
  const stream = $("thought-stream");
  if (!stream) return;

  const type    = payload.type || "thought";
  const content = payload.content || "";
  const tsIso   = payload.timestamp || "";
  const tsDate  = tsIso ? new Date(tsIso) : null;
  const tsRel   = tsDate ? relTime(tsDate) : "";
  // Tooltip with full date+time so previous-day events aren't ambiguous
  const tsFull  = tsDate && !isNaN(tsDate) ? tsDate.toLocaleString() : "";

  const div = document.createElement("div");
  div.className = `bubble ${type}${isHistory ? " history" : ""}`;
  div.setAttribute("role", "button");
  div.setAttribute("tabindex", "0");
  div.setAttribute("aria-expanded", "false");
  div.setAttribute("aria-label", `${type} — click to expand`);
  div.innerHTML = `
    <div class="meta">
      <span class="left">
        <span class="ts" data-ts="${esc(tsIso)}" title="${esc(tsFull)}">${esc(tsRel)}</span>
        <span>·</span>
        <span>${esc(type)}</span>
      </span>
      <span class="chevron" aria-hidden="true">▾</span>
    </div>
    <div class="body collapsed">${esc(content)}</div>`;

  const toggle = () => {
    const body    = div.querySelector(".body");
    const chevron = div.querySelector(".chevron");
    const nowCollapsed = body.classList.toggle("collapsed");
    chevron.textContent = nowCollapsed ? "▾" : "▴";
    div.setAttribute("aria-expanded", String(!nowCollapsed));
  };
  div.onclick = toggle;
  div.onkeydown = e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
  };

  const wasNearBottom = isNearBottom(stream);
  // Cap at 120 bubbles + separators
  while (stream.children.length >= 121) stream.removeChild(stream.firstChild);
  stream.appendChild(div);

  // After layout: if content fits within the 4-line clamp, drop the
  // expand affordance — the chevron and button semantics imply
  // hidden content that isn't there.
  requestAnimationFrame(() => {
    const body = div.querySelector(".body");
    if (body && body.scrollHeight <= body.clientHeight + 1) {
      div.classList.add("no-overflow");
      div.removeAttribute("role");
      div.removeAttribute("tabindex");
      div.removeAttribute("aria-expanded");
      div.removeAttribute("aria-label");
      div.onclick = null;
      div.onkeydown = null;
    }
  });

  if (wasNearBottom) {
    stream.scrollTop = stream.scrollHeight;
    const hint = $("scroll-hint");
    if (hint) hint.style.display = "none";
  } else {
    const hint = $("scroll-hint");
    if (hint && !isHistory) hint.style.display = "block";
  }
}

function esc(str) {
  return String(str)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

let _toastTimer = null;
function toast(message, durationMs = 4000) {
  const t = $("toast");
  if (!t) return;
  t.textContent = message;
  t.classList.add("show");
  if (_toastTimer) clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove("show"), durationMs);
}

// Legend popover — opens below the "?" trigger, closes on outside click / Escape.
function attachLegend() {
  const trigger = $("legend-trigger");
  if (!trigger) return;
  let pop = null;
  const close = () => {
    if (pop) { pop.remove(); pop = null; }
    trigger.setAttribute("aria-expanded", "false");
    document.removeEventListener("click", onOutside, true);
    document.removeEventListener("keydown", onEsc, true);
  };
  const onOutside = e => { if (pop && !pop.contains(e.target) && e.target !== trigger) close(); };
  const onEsc     = e => { if (e.key === "Escape") close(); };
  const open = () => {
    pop = document.createElement("div");
    pop.className = "legend-pop open";
    pop.setAttribute("role", "tooltip");
    pop.innerHTML = `
      <div class="row">
        <div class="swatch" style="background:var(--border)"></div>
        <div><b>thought</b><div class="desc">A single LLM-generated thought cycle.</div></div>
      </div>
      <div class="row">
        <div class="swatch" style="background:var(--reflect)"></div>
        <div><b>reflection</b><div class="desc">Meta-cognitive pass over recent thoughts (italic).</div></div>
      </div>
      <div class="row">
        <div class="swatch" style="background:var(--perceive)"></div>
        <div><b>perception</b><div class="desc">External stimulus injected into the prompt (e.g. a Wikipedia snippet).</div></div>
      </div>
      <div class="row">
        <div class="swatch" style="background:var(--online)"></div>
        <div><b>identity shift</b><div class="desc">A reflection that revised the self-concept.</div></div>
      </div>
      <div class="footnote">Faded bubbles are replayed from the journal (history). Solid = live.</div>
      <div class="shortcut">Shortcuts: <kbd>N</kbd> new · <kbd>1</kbd>–<kbd>9</kbd> switch tab</div>`;
    document.body.appendChild(pop);
    const r = trigger.getBoundingClientRect();
    pop.style.top  = (r.bottom + 6) + "px";
    pop.style.left = Math.max(8, r.right - pop.offsetWidth) + "px";
    trigger.setAttribute("aria-expanded", "true");
    setTimeout(() => {
      document.addEventListener("click", onOutside, true);
      document.addEventListener("keydown", onEsc, true);
    }, 0);
  };
  trigger.onclick = () => pop ? close() : open();
}

// Human-friendly relative time. ts may be a Date, ISO string, or epoch ms.
function relTime(ts) {
  const t = ts instanceof Date ? ts.getTime() : new Date(ts).getTime();
  if (!Number.isFinite(t)) return "—";
  const s = Math.max(0, Math.round((Date.now() - t) / 1000));
  if (s < 5)    return "just now";
  if (s < 60)   return `${s}s ago`;
  const m = Math.floor(s / 60);
  if (m < 60)   return `${m}m ago`;
  const h = Math.floor(m / 60);
  if (h < 24)   return `${h}h ago`;
  const d = Math.floor(h / 24);
  return `${d}d ago`;
}

// Refresh relative times each minute (cheap; small DOM).
setInterval(() => {
  document.querySelectorAll("[data-ts]").forEach(el => {
    el.textContent = relTime(el.getAttribute("data-ts"));
  });
  const refl = $("stat-refl");
  if (refl && refl.dataset.ts) refl.textContent = relTime(refl.dataset.ts);
}, 30_000);

// ── spawn / stop ──────────────────────────────────────────────────────────

let providerCache = null;
async function loadProviders() {
  if (providerCache) return providerCache;
  try {
    const res = await fetch("/providers");
    if (res.ok) providerCache = await res.json();
  } catch (_) {}
  return providerCache || {};
}

// Persist last-used provider/model so a second + New doesn't make the user
// reselect. Cleared if the cached value falls out of the allowlist.
const SPAWN_PREFS_KEY = "acsf.spawn_prefs.v1";
function loadSpawnPrefs() {
  try { return JSON.parse(localStorage.getItem(SPAWN_PREFS_KEY)) || {}; }
  catch (_) { return {}; }
}
function saveSpawnPrefs(prefs) {
  try { localStorage.setItem(SPAWN_PREFS_KEY, JSON.stringify(prefs)); } catch (_) {}
}

async function openSpawnModal(initialName = "") {
  const providers = await loadProviders();
  const providerKeys = Object.keys(providers);
  if (providerKeys.length === 0) {
    toast("No providers available. Check that scripts/web.py launched successfully.");
    return;
  }

  const prefs = loadSpawnPrefs();
  const initialProvider = providerKeys.includes(prefs.provider) ? prefs.provider : providerKeys[0];
  const initialModels = providers[initialProvider] || [];
  const initialModel  = initialModels.includes(prefs.model) ? prefs.model : (initialModels[0] || "");

  const backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop";
  backdrop.setAttribute("role", "dialog");
  backdrop.setAttribute("aria-modal", "true");
  backdrop.setAttribute("aria-label", "Spawn a new consciousness");

  backdrop.innerHTML = `
    <form class="modal" id="spawn-form">
      <h3>Spawn a consciousness</h3>
      <label for="spawn-name">Name</label>
      <input type="text" id="spawn-name" required pattern="[A-Za-z0-9_\\-]+"
             maxlength="64" autocomplete="off" placeholder="Aria"
             title="Letters, digits, underscore, or hyphen" />
      <label for="spawn-provider">Provider</label>
      <select id="spawn-provider">
        ${providerKeys.map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join("")}
      </select>
      <label for="spawn-model">Model</label>
      <select id="spawn-model"></select>
      <div class="modal-error" id="spawn-error" role="alert"></div>
      <div class="modal-actions">
        <button type="button" id="spawn-cancel">Cancel</button>
        <button type="submit" class="primary" id="spawn-submit">Spawn</button>
      </div>
    </form>`;
  document.body.appendChild(backdrop);

  const nameInput      = $("spawn-name");
  const providerSelect = $("spawn-provider");
  const modelSelect    = $("spawn-model");
  const errBox         = $("spawn-error");

  const refreshModels = (preferred = "") => {
    const models = providers[providerSelect.value] || [];
    if (models.length === 0) {
      modelSelect.innerHTML = `<option value="">(no models for this provider)</option>`;
      modelSelect.disabled = true;
    } else {
      modelSelect.innerHTML = models.map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join("");
      modelSelect.disabled = false;
      if (preferred && models.includes(preferred)) modelSelect.value = preferred;
    }
  };
  providerSelect.onchange = () => refreshModels();
  providerSelect.value = initialProvider;
  refreshModels(initialModel);
  if (initialName) nameInput.value = initialName;

  // Client-side conflict check: a running instance with this name cannot be
  // spawned (409 would come back). Surface that without a roundtrip.
  const conflicts = new Set();
  try {
    const list = await (await fetch("/instances")).json();
    list.forEach(i => { if (i.running) conflicts.add(i.id); });
  } catch (_) {}
  const checkConflict = () => {
    if (conflicts.has(nameInput.value.trim())) {
      errBox.textContent = `“${nameInput.value.trim()}” is already running. Stop it first or choose a different name.`;
    } else if (errBox.textContent.includes("already running")) {
      errBox.textContent = "";
    }
  };
  nameInput.addEventListener("input", checkConflict);

  const close = () => {
    backdrop.remove();
    document.removeEventListener("keydown", onEsc);
  };
  const onEsc = e => { if (e.key === "Escape") { e.preventDefault(); close(); } };
  document.addEventListener("keydown", onEsc);
  backdrop.addEventListener("click", e => { if (e.target === backdrop) close(); });
  $("spawn-cancel").onclick = close;

  requestAnimationFrame(() => nameInput.focus());

  $("spawn-form").onsubmit = async e => {
    e.preventDefault();
    const submit = $("spawn-submit");
    errBox.textContent = "";
    const payload = {
      name: nameInput.value.trim(),
      provider: providerSelect.value || null,
      model: modelSelect.value || null,
    };
    if (!payload.name) { errBox.textContent = "Name is required."; return; }
    if (conflicts.has(payload.name)) { checkConflict(); return; }

    submit.disabled = true;
    submit.textContent = "Spawning…";
    try {
      const res = await fetch("/instances", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        let detail = typeof data.detail === "string"
          ? data.detail
          : `Spawn failed (${res.status})`;
        // Provider-specific hint: an Ollama 500 most often means the daemon
        // isn't running locally.
        if (res.status >= 500 && payload.provider === "ollama") {
          detail += " (is `ollama serve` running?)";
        }
        errBox.textContent = detail;
        submit.disabled = false;
        submit.textContent = "Spawn";
        return;
      }
      const created = await res.json();
      saveSpawnPrefs({ provider: payload.provider, model: payload.model });
      close();
      toast(`Spawned “${created.id}” — booting`);
      // Eagerly switch to the new instance; the live stream will fill in.
      await loadInstances();
      const instances = await (await fetch("/instances")).json();
      selectInstance(created.id, instances);
      showBootingState(`Booting “${created.id}” — first thought in 10–30s`);
    } catch (e) {
      errBox.textContent = "Network error.";
      submit.disabled = false;
      submit.textContent = "Spawn";
    }
  };
}

// In-app confirmation modal — replaces native `confirm()` for theme-consistent
// destructive-action confirmation. Returns a Promise<boolean>.
function confirmModal({ title, message, confirmText = "OK", cancelText = "Cancel", destructive = false }) {
  return new Promise(resolve => {
    const host = $("confirm-host") || document.body;
    const backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    backdrop.setAttribute("role", "alertdialog");
    backdrop.setAttribute("aria-modal", "true");
    backdrop.setAttribute("aria-label", title || "Confirm action");
    backdrop.innerHTML = `
      <div class="modal" style="max-width:380px">
        <h3>${esc(title || "Confirm")}</h3>
        <div class="confirm-message">${esc(message || "")}</div>
        <div class="modal-actions">
          <button type="button" id="cm-cancel">${esc(cancelText)}</button>
          <button type="button" class="${destructive ? "danger" : "primary"}" id="cm-ok">${esc(confirmText)}</button>
        </div>
      </div>`;
    host.appendChild(backdrop);

    const done = (val) => {
      backdrop.remove();
      document.removeEventListener("keydown", onKey);
      resolve(val);
    };
    const onKey = e => {
      if (e.key === "Escape")  { e.preventDefault(); done(false); }
      if (e.key === "Enter")   { e.preventDefault(); done(true);  }
    };
    document.addEventListener("keydown", onKey);
    backdrop.addEventListener("click", e => { if (e.target === backdrop) done(false); });
    $("cm-cancel").onclick = () => done(false);
    $("cm-ok").onclick     = () => done(true);
    requestAnimationFrame(() => $("cm-ok").focus());
  });
}

function showBootingState(message) {
  const stream = $("thought-stream");
  if (!stream) return;
  removeWaitingState();
  const w = document.createElement("div");
  w.className = "stream-waiting";
  w.innerHTML = `
    <span class="pulse" aria-hidden="true"></span>
    <span>${esc(message)}</span>`;
  stream.appendChild(w);
  stream.scrollTop = stream.scrollHeight;
}

async function startCurrentInstance() {
  if (!currentId) return;
  const btn = $("start-btn");
  if (btn) { btn.disabled = true; btn.textContent = "Starting…"; }
  try {
    const res = await fetch("/instances", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: currentId }),
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      let detail = typeof data.detail === "string" ? data.detail : `${res.status}`;
      toast(`Start failed: ${detail}`);
    } else {
      toast(`Started “${currentName}” — booting`);
      showBootingState(`Resuming “${currentName}” — first thought in 10–30s`);
    }
  } catch (_) {
    toast("Network error starting instance.");
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = "Start"; }
    // Refresh — tab dot turns online once the agent's first cycle saves state.
    await loadInstances();
    // Reconnect the SSE stream so live events flow without a tab re-click.
    connectSSE(currentId);
  }
}

async function stopCurrentInstance() {
  if (!currentId) return;
  const ok = await confirmModal({
    title: "Stop instance?",
    message: `“${currentName}” will receive SIGTERM and shut down after the current thought cycle (up to 5s grace).`,
    confirmText: "Stop",
    destructive: true,
  });
  if (!ok) return;
  const btn = $("stop-btn");
  if (btn) { btn.disabled = true; btn.textContent = "Stopping…"; }
  try {
    const res = await fetch(`/instances/${encodeURIComponent(currentId)}/stop`, {
      method: "POST",
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      toast(`Stop failed: ${data.detail || res.status}`);
    } else {
      toast(`Stopping “${currentName}”…`);
    }
  } catch (_) {
    toast("Network error stopping instance.");
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = "Stop"; }
    // Refresh state — tab dot will turn offline once the agent exits.
    await loadInstances();
  }
}

// ── boot ──────────────────────────────────────────────────────────────────

// React to deep-link hash changes (back button / pasted URL)
window.addEventListener("hashchange", async () => {
  const hashed = decodeURIComponent((location.hash || "").replace(/^#\/?/, ""));
  if (!hashed || hashed === currentId) return;
  try {
    const instances = await (await fetch("/instances")).json();
    instances.forEach(i => { if (!i.id) i.id = i.name; });
    if (instances.find(i => i.id === hashed)) selectInstance(hashed, instances);
  } catch (_) {}
});

// Wire the header "+ New" button (replaces the inline tab variant)
const newBtn = $("new-btn");
if (newBtn) newBtn.onclick = () => openSpawnModal();

// Keyboard shortcuts — ignore when a modal is open or the user is typing.
function keyboardShortcuts(e) {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (document.querySelector(".modal-backdrop")) return;
  const tag = (document.activeElement && document.activeElement.tagName) || "";
  if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;

  // N → open spawn modal
  if (e.key === "n" || e.key === "N") {
    e.preventDefault();
    openSpawnModal();
    return;
  }
  // 1–9 → switch tab by position
  if (/^[1-9]$/.test(e.key)) {
    const idx = parseInt(e.key, 10) - 1;
    const tabs = document.querySelectorAll("#instance-tabs .tab");
    if (tabs[idx]) tabs[idx].click();
  }
}
document.addEventListener("keydown", keyboardShortcuts);

loadInstances();
setInterval(loadInstances, 10000);
</script>
